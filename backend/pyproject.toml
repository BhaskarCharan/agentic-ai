[project]
name = "agentic-ai-backend"
version = "0.1.0"
description = "FastAPI + LangGraph agent backend with a multiply tool, MongoDB checkpointing, and SSE streaming."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # --- Web framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # --- Agent framework: builds the tool-calling graph, gives us
    # checkpointing (persisted history) and interrupt/resume (human-in-the-loop)
    # for free. Floor bumped to 1.x to match what's actually installed.
    "langgraph>=1.2.0",
    # --- Persists LangGraph checkpoints (conversation state) straight into MongoDB.
    "langgraph-checkpoint-mongodb>=0.1.0",
    # --- LLM adapter: wraps the Gemini API behind LangChain's chat-model
    # interface so LangGraph can bind tools to it and stream tokens.
    "langchain-google-genai>=2.0.0",
    # --- `create_agent`, used to build each specialist sub-agent (weather,
    # and Gmail/LinkedIn in later phases) - was a transitive dep via
    # langchain-google-genai, pinned explicitly now that we import from it
    # directly in agent/weather_agent.py.
    "langchain>=1.3.9",
    # --- Async MongoDB driver, used for our own "sessions" metadata collection.
    "motor>=3.6.0",
    # --- Typed settings loaded from environment variables / .env file.
    "pydantic-settings>=2.6.0",
    # --- LangSmith tracing client. Already a transitive dep of
    # langchain-core; pinned explicitly since app/config.py now deliberately
    # depends on its env-var-driven auto-tracing behavior.
    "langsmith>=0.10.0",
    # --- Async HTTP client. Used at runtime by the weather tool (Open-Meteo
    # calls) - also used by tests' AsyncClient, so it covers both.
    "httpx>=0.28.0",
    # --- Composio SDK: manages OAuth connections to Gmail/LinkedIn (consent
    # flow, connection status) and will supply their tool objects from
    # Phase 2 onward. Only `services/integration_service.py` imports this
    # directly - same "one file owns the third-party client" convention as
    # `agent/llm.py` for Gemini.
    "composio>=0.17.0",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",      # linter + formatter
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# Our Motor/pymongo clients are module-level singletons created once at
# import time and bound to the first event loop they see - a fresh loop per
# test (pytest-asyncio's default) breaks them on the second test. Sharing
# one loop for the whole session keeps them usable across all tests.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app"]
